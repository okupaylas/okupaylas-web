<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilim - OkuPaylaş</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
}

header{
    background:#1e88e5;
    color:white;
    padding:20px;
    text-align:center;
}

.profil{
    width:90%;
    max-width:500px;
    margin:30px auto;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

img{
    width:120px;
    height:120px;
    border-radius:50%;
    display:block;
    margin:auto;
}

h2{
    text-align:center;
}

.bilgi{
    margin-top:20px;
}

.bilgi p{
    font-size:18px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#1e88e5;
    color:white;
    font-size:16px;
}
</style>

</head>

<body>

<header>
<h1>📚 OkuPaylaş</h1>
</header>

<div class="profil">

<img src="https://via.placeholder.com/120" alt="Profil">

<h2>Kullanıcı Adı</h2>

<div class="bilgi">
<p>⭐ Puan: 5.0</p>
<p>📚 Eklenen Kitap: 0</p>
<p>❤️ Favori Kitap: 0</p>
<p>💬 Mesaj: 0</p>
</div>

<button>Bilgilerimi Düzenle</button>
<button onclick="window.location.href='index.html'">Ana Sayfaya Dön</button>

</div>

</body>
</html>
