<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="quote">
    <h2>📖 Bugünün Kitap Cümlesi</h2>
    <blockquote>
        "Kitaplar, yeni hayatlara açılan sessiz kapılardır."
    </blockquote>

    <div class="quote-buttons">
        <button onclick="this.innerHTML='❤️ Beğenildi'">❤️ Beğen</button>
<button onclick="this.innerHTML='💬 Yorum Açıldı'">💬 Yorum Yap</button>
<button onclick="this.innerHTML='↪️ Paylaşıldı'">↪️ Paylaş</button>
    </div>
</section>
<section class="hero">
  <h1>📚 OkuPaylaş</h1>
  <p>Kitaplarını paylaş, yeni hikâyeler keşfet ve binlerce okurla buluş.</p>

  <div class="hero-buttons">
    <a href="kitap-ekle.html" class="btn">Kitap Ekle</a>
<a href="kayit.html" class="btn btn-outline">Kayıt Ol</a>
  </div>
</section> 
    <section class="book-search">
    <h2>🔎 Kitap Ara</h2>
    <input type="text" id="bookSearch" placeholder="Kitap adı veya yazar ara...">
</section>
<div class="books">

  <div class="card">
    <h2>Simyacı</h2>
    <p>Paulo Coelho</p>
    <a href="simyaci.html" class="btn">İncele</a>
  </div>

  <div class="card">
    <h2>Kürk Mantolu Madonna</h2>
    <p>Sabahattin Ali</p>
    <button>İncele</button>
  </div>

  <div class="card">
    <h2>1984</h2>
    <p>George Orwell</p>
    <button>İncele</button>
  </div>

</div>
    <script>
const searchInput = document.getElementById("bookSearch");
const books = document.querySelectorAll(".card");

searchInput.addEventListener("input", function () {
    const searchText = this.value.toLowerCase();

    books.forEach(function (book) {
        const title = book.querySelector("h2").textContent.toLowerCase();
        const author = book.querySelector("p").textContent.toLowerCase();

        if (title.includes(searchText) || author.includes(searchText)) {
            book.style.display = "block";
        } else {
            book.style.display = "none";
        }
    });
});
</script>
</body>
</html>
