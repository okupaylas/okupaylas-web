<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitap Ekle - OkuPaylaş</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#1e88e5;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:500px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

input, textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:#1e88e5;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}
</style>
</head>

<body>

<header>
<h1>📚 Kitap Ekle</h1>
</header>

<div class="container">

<input type="text" placeholder="Kitap Adı">

<input type="text" placeholder="Yazar Adı">

<textarea rows="5" placeholder="Kitap hakkında kısa açıklama"></textarea>

<input type="file">

<button>Kitabı Yayınla</button>

<button onclick="window.location.href='index.html'">
Ana Sayfaya Dön
</button>

</div>

</body>
</html>
