<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıt Ol - OkuPaylaş</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    text-align:center;
    padding:40px;
}

h1{
    color:#1565c0;
}

input{
    width:80%;
    max-width:320px;
    padding:12px;
    margin:10px;
    font-size:16px;
}

button{
    background:#1565c0;
    color:white;
    border:none;
    padding:12px 25px;
    font-size:18px;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>📚 OkuPaylaş</h1>
<h2>Kayıt Ol</h2>

<input type="text" id="ad" placeholder="Ad Soyad"><br>
<input type="email" id="email" placeholder="E-posta"><br>
<input type="password" id="sifre" placeholder="Şifre"><br><br>

<button onclick="kayitOl()">Kayıt Ol</button>

<script>
function kayitOl() {
    const ad = document.getElementById("ad").value;
    const email = document.getElementById("email").value;

    if(ad==="" || email===""){
        alert("Lütfen tüm alanları doldurun.");
        return;
    }

    alert("Tebrikler " + ad + "! Kayıt işlemi örnek olarak tamamlandı.");
}
</script>

</body>
</html>
